# Deploys master to the production app cipp-fn-cac (Canada Central, P0v3 Linux). Cut over 2026-09-05;
# master_cippdtdpl.yml (old East US 2 app) is disabled and kept only for rollback.
name: Build and deploy Powershell project to Azure Function App - cipp-fn-cac

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout master'
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'cipp-fn-cac'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CIPPFNCAC }}
