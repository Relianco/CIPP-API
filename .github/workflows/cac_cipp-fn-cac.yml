# Deploys the master branch to the new Canada Central app cipp-fn-cac (P0v3 Linux).
# Lives on branch deploy-cac and runs only on manual trigger so that pushes to master keep
# deploying only the current production app until cutover. At cutover this file moves to master
# with an `on: push` trigger and master_cippdtdpl.yml is disabled.
name: Deploy master to Azure Function App - cipp-fn-cac (Canada Central)

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout master'
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'cipp-fn-cac'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CIPPFNCAC }}
